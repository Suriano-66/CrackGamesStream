<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>CrackGames — Source</title>
<link rel="stylesheet" href="./source.css" />
<script type="importmap">
{"imports":{
  "three":"../vendor/three/build/three.module.js",
  "cannon-es":"../vendor/cannon-es/dist/cannon-es.js"
}}
</script>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="hud">
    <div class="topbar">
      <span class="title">🏁 La grande course</span>
      <span id="timer" class="timer"></span>
    </div>

    <!-- Bras de fer Rouge vs Bleu (masqué pour les autres jeux) -->
    <div id="tug" class="tug" hidden>
      <div class="tug-side tug-r">🔴 0</div>
      <div class="tug-bar">
        <div class="tug-fill"></div>
        <div class="tug-core"></div>
      </div>
      <div class="tug-side tug-b">0 🔵</div>
    </div>

    <!-- Classement à droite : texte seul, médailles top 3 -->
    <div id="rank" class="rank"></div>

    <!-- Centre : attente / compte à rebours / gagnant (texte seul) -->
    <div id="center" class="center"></div>

    <div id="cta" class="cta">🎁 Offre un cadeau pour lâcher tes billes !</div>
    <div id="conn" class="conn"></div>
  </div>
  <script type="module" src="./source.js"></script>
</body>
</html>
